<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#E9EEF1; --ink:#14213D; --muted:#5B677D; --stage:#0F1A2E; --accent:#2F5BEA; --danger:#C93C3C; --line:#C3CDD6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0B1220; --ink:#E8EDF5; --muted:#93A0B5; --stage:#050A14; --accent:#5B84FF; --line:#26324A; }
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'Onest', system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line);
           background: transparent; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.off { background: #fff; color: #14213D; }

  #lobby { max-width: 520px; margin: 0 auto; padding: 32px 20px; display: grid; gap: 16px; }
  #lobby h1 { margin: 0; font-size: 2rem; line-height: 1.1; }
  #lobby p { margin: 0; color: var(--muted); }
  #preview { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: var(--stage);
             border-radius: 16px; transform: scaleX(-1); }
  #error { color: var(--danger); }

  #call { position: fixed; inset: 0; background: var(--stage); }
  #remote { width: 100%; height: 100%; object-fit: contain; }
  #local { position: absolute; right: 16px; bottom: 96px; width: min(28vw, 220px); aspect-ratio: 4/3;
           object-fit: cover; border-radius: 12px; transform: scaleX(-1); border: 2px solid rgba(255,255,255,.3); }
  #status { position: absolute; top: 16px; left: 16px; padding: 8px 14px; border-radius: 999px;
            background: rgba(0,0,0,.55); color: #fff; font-size: .9rem; }
  .bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;
         padding: 8px; border-radius: 999px; background: rgba(0,0,0,.55); }
  .bar button { color: #fff; border-color: rgba(255,255,255,.3); }
</style>
</head>
<body>

<main id="lobby">
  <h1>Ready to join?</h1>
  <video id="preview" autoplay playsinline muted></video>
  <p>Room <strong id="roomName"></strong>. Share this page's link with the person you want to call.</p>
  <p id="error" role="alert" hidden></p>
  <button id="join" class="primary">Join call</button>
</main>

<main id="call" hidden>
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div id="status" role="status">Connecting…</div>
  <div class="bar">
    <button id="mic">Mute</button>
    <button id="cam">Camera off</button>
    <button id="copy">Copy link</button>
    <button id="leave" class="danger">Leave</button>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

// Each room lives in the URL hash, e.g. http://localhost:3000/#k3j9x2
if (!location.hash) location.hash = Math.random().toString(36).slice(2, 8);
const room = location.hash.slice(1);
$('roomName').textContent = room;

// STUN lets each browser discover its public address. Add a TURN server here for strict networks.
const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

let localStream, ws, pc;

// 1. Ask for camera and mic, then show a preview in the lobby.
(async () => {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    $('preview').srcObject = localStream;
  } catch (err) {
    $('error').textContent = 'Could not access camera or microphone. Allow access in your browser and reload. (' + err.name + ')';
    $('error').hidden = false;
    $('join').disabled = true;
  }
})();

// 2. Connect to the signaling server and announce which room we want.
$('join').onclick = () => {
  $('lobby').hidden = true;
  $('call').hidden = false;
  $('local').srcObject = localStream;

  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', room }));
    setStatus('Waiting for someone to join…');
  };
  ws.onmessage = (e) => handleSignal(JSON.parse(e.data));
};

const send = (msg) => ws.send(JSON.stringify(msg));
const setStatus = (t) => { $('status').textContent = t; };

// 3. The RTCPeerConnection carries the actual audio and video.
function createPeerConnection() {
  pc = new RTCPeerConnection(RTC_CONFIG);
  localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
  pc.ontrack = (e) => { $('remote').srcObject = e.streams[0]; };
  // Every network route the browser discovers ("ICE candidate") goes to the other peer via signaling.
  pc.onicecandidate = (e) => { if (e.candidate) send({ type: 'candidate', candidate: e.candidate }); };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') setStatus('Connected');
    if (s === 'disconnected' || s === 'failed') setStatus('Connection lost');
  };
}

// 4. Offer/answer handshake, relayed through the server.
async function handleSignal(msg) {
  switch (msg.type) {
    case 'peer-joined': {           // we were here first, so we make the offer
      setStatus('Connecting…');
      createPeerConnection();
      await pc.setLocalDescription(await pc.createOffer());
      send({ type: 'offer', sdp: pc.localDescription });
      break;
    }
    case 'offer': {                 // we joined second, so we answer
      setStatus('Connecting…');
      createPeerConnection();
      await pc.setRemoteDescription(msg.sdp);
      await pc.setLocalDescription(await pc.createAnswer());
      send({ type: 'answer', sdp: pc.localDescription });
      break;
    }
    case 'answer':
      await pc.setRemoteDescription(msg.sdp);
      break;
    case 'candidate':
      try { await pc.addIceCandidate(msg.candidate); } catch (err) { console.error(err); }
      break;
    case 'peer-left':
      if (pc) pc.close();
      pc = null;
      $('remote').srcObject = null;
      setStatus('The other person left. Waiting for someone to join…');
      break;
    case 'full':
      setStatus('This room already has two people. Open a new room by removing the # part of the URL.');
      break;
  }
}

// 5. Controls
function toggle(btn, kind, onLabel, offLabel) {
  btn.onclick = () => {
    const track = localStream.getTracks().find((t) => t.kind === kind);
    track.enabled = !track.enabled;
    btn.textContent = track.enabled ? onLabel : offLabel;
    btn.classList.toggle('off', !track.enabled);
  };
}
toggle($('mic'), 'audio', 'Mute', 'Unmute');
toggle($('cam'), 'video', 'Camera off', 'Camera on');

$('copy').onclick = async () => {
  await navigator.clipboard.writeText(location.href);
  $('copy').textContent = 'Copied';
  setTimeout(() => ($('copy').textContent = 'Copy link'), 1500);
};

$('leave').onclick = () => {
  if (pc) pc.close();
  if (ws) ws.close();
  localStream.getTracks().forEach((t) => t.stop());
  location.reload();
};
</script>
</body>
</html>
